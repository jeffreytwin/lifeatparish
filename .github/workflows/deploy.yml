name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from Actions tab

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create config.js
        env:
          MAPBOX_ACCESS_TOKEN_VAR: ${{ vars.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_ACCESS_TOKEN_SECRET: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          WIX_CLIENT_ID: ${{ vars.WIX_CLIENT_ID }}
        run: |
          MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN_VAR:-$MAPBOX_ACCESS_TOKEN_SECRET}"
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "MAPBOX_ACCESS_TOKEN is missing. Set it as a repository variable or secret."
            exit 1
          fi

          WIX_CLIENT_ID_VALUE="${WIX_CLIENT_ID:-7cbe278c-f794-4ac6-8261-404022bb5625}"

          cat > public/config.js << EOF
          // config.js - Configuration settings for the application

          // Application configuration
          window.config = {
              // Mapbox access token
              mapboxAccessToken: '${MAPBOX_ACCESS_TOKEN}',

              // Wix OAuth Client ID
              wixClientId: '${WIX_CLIENT_ID_VALUE}',

              // Other configuration options
              appName: 'Parrish Map',
              appVersion: '1.0.0',
          };
          EOF

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: lifeatparrish
